<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senti Aura Links</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "Poppins", ui-sans-serif, system-ui, sans-serif;
    }
  </style>
  
  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .delay-100 { animation-delay: 100ms; }
    .delay-200 { animation-delay: 200ms; }
    .delay-300 { animation-delay: 300ms; }
    .opacity-0 { opacity: 0; }
  </style>
</head>
<body class="min-h-screen bg-neutral-950 text-white selection:bg-amber-500/30 font-sans">
  
  <!-- Background Ambience -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full opacity-10 blur-[120px] bg-amber-600 mix-blend-screen"></div>
    <div class="absolute top-[40%] -right-[10%] w-[40%] h-[40%] rounded-full opacity-5 blur-[120px] bg-yellow-500 mix-blend-screen"></div>
    <div class="absolute -bottom-[10%] left-[20%] w-[60%] h-[60%] rounded-full opacity-10 blur-[150px] bg-amber-700 mix-blend-screen"></div>
  </div>

  <div class="relative z-10 min-h-screen flex flex-col items-center py-16 px-5 sm:px-6 lg:px-8 max-w-2xl mx-auto">
    
    <!-- Profile Section -->
    <div class="flex flex-col items-center text-center space-y-6 mb-14 animate-fade-up opacity-0">
      <div class="relative group p-1">
        <div class="absolute inset-0 bg-gradient-to-tr from-amber-400 to-amber-700 rounded-full blur-md opacity-40 group-hover:opacity-75 transition-opacity duration-700"></div>
        <img 
          src="logo.jpg" 
          alt="Senti Aura"
          class="relative w-32 h-32 rounded-full object-cover border-[3px] border-amber-500/80 shadow-2xl shadow-amber-900/20"
        />
      </div>
      
      <div>
        <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-white mb-2">
          Senti Aura
        </h1>
        <p class="text-base sm:text-lg font-light text-amber-100/70 max-w-sm mx-auto leading-relaxed">
          Descubre tu fragancia ideal. Perfumería exclusiva con marcas de primer nivel.
        </p>
      </div>
    </div>

    <!-- Links List -->
    <div class="w-full flex flex-col gap-4 mb-20">
      
      <!-- WhatsApp Link -->
      <a href="https://wa.me/5493516414867?text=Hola!%20Me%20gustar%C3%ADa%20saber%20m%C3%A1s%20sobre%20sus%20perfumes." target="_blank" rel="noopener noreferrer" 
         class="animate-fade-up delay-100 opacity-0 group relative flex items-center p-4 sm:p-5 w-full overflow-hidden rounded-2xl backdrop-blur-md border transition-all duration-500 bg-gradient-to-r from-amber-400 via-amber-500 to-yellow-600 text-neutral-950 border-transparent shadow-[0_0_30px_-5px_rgba(245,158,11,0.3)] hover:-translate-y-0.5 hover:scale-[1.02]">
        <div class="p-2.5 rounded-xl flex-shrink-0 transition-colors duration-500 bg-neutral-950/10">
          <i data-lucide="message-circle" class="w-[1.125rem] h-[1.125rem]"></i>
        </div>
        <div class="flex-1 text-center pr-10 text-[1rem] font-bold tracking-wide">
          Consúltanos por WhatsApp
        </div>
        <div class="absolute right-5 opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300 text-neutral-900">
          <i data-lucide="external-link" class="w-5 h-5"></i>
        </div>
      </a>

      <!-- Instagram Link -->
      <a href="https://www.instagram.com/senti.aura" target="_blank" rel="noopener noreferrer" 
         class="animate-fade-up delay-200 opacity-0 group relative flex items-center p-4 sm:p-5 w-full overflow-hidden rounded-2xl backdrop-blur-md border transition-all duration-500 bg-neutral-900/50 border-amber-500/20 hover:border-amber-400/60 hover:bg-neutral-900/80 text-white hover:shadow-[0_0_20px_-5px_rgba(245,158,11,0.15)] hover:-translate-y-0.5 hover:scale-[1.02]">
        <div class="p-2.5 rounded-xl flex-shrink-0 transition-colors duration-500 bg-neutral-800/80 group-hover:bg-amber-500/20 group-hover:text-amber-400 text-amber-100/70">
          <i data-lucide="instagram" class="w-[1.125rem] h-[1.125rem]"></i>
        </div>
        <div class="flex-1 text-center pr-10 text-[1rem] font-medium tracking-wide">
          Sígueme en Instagram
        </div>
        <div class="absolute right-5 opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300 text-amber-400">
          <i data-lucide="external-link" class="w-5 h-5"></i>
        </div>
      </a>

      <!-- TikTok Link -->
      <a href="https://www.tiktok.com/@sentiaura" target="_blank" rel="noopener noreferrer" 
         class="animate-fade-up delay-300 opacity-0 group relative flex items-center p-4 sm:p-5 w-full overflow-hidden rounded-2xl backdrop-blur-md border transition-all duration-500 bg-neutral-900/50 border-amber-500/20 hover:border-amber-400/60 hover:bg-neutral-900/80 text-white hover:shadow-[0_0_20px_-5px_rgba(245,158,11,0.15)] hover:-translate-y-0.5 hover:scale-[1.02]">
        <div class="p-2.5 rounded-xl flex-shrink-0 transition-colors duration-500 bg-neutral-800/80 group-hover:bg-amber-500/20 group-hover:text-amber-400 text-amber-100/70">
          <svg class="w-[1.125rem] h-[1.125rem]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 12a4 4 0 1 0 4 4v-12a5 5 0 0 0 5 5" />
          </svg>
        </div>
        <div class="flex-1 text-center pr-10 text-[1rem] font-medium tracking-wide">
          Mira mis videos en TikTok
        </div>
        <div class="absolute right-5 opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300 text-amber-400">
          <i data-lucide="external-link" class="w-5 h-5"></i>
        </div>
      </a>

    </div>

    <!-- Footer / Social Icons -->
    <div class="mt-auto flex items-center justify-center gap-6 pb-2 w-full animate-fade-up delay-300 opacity-0">
      <a href="https://www.instagram.com/senti.aura" target="_blank" rel="noopener noreferrer" aria-label="Instagram"
         class="p-3.5 bg-neutral-900/40 rounded-full text-amber-100/50 flex items-center justify-center border border-amber-500/10 hover:text-amber-400 hover:border-amber-500/40 hover:bg-neutral-900 shadow-xl transition-all duration-300 hover:scale-110 hover:-translate-y-1">
        <i data-lucide="instagram" class="w-5 h-5"></i>
      </a>
      <a href="https://www.tiktok.com/@sentiaura" target="_blank" rel="noopener noreferrer" aria-label="TikTok"
         class="p-3.5 bg-neutral-900/40 rounded-full text-amber-100/50 flex items-center justify-center border border-amber-500/10 hover:text-amber-400 hover:border-amber-500/40 hover:bg-neutral-900 shadow-xl transition-all duration-300 hover:scale-110 hover:-translate-y-1">
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 12a4 4 0 1 0 4 4v-12a5 5 0 0 0 5 5" />
          </svg>
      </a>
    </div>

  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();
  </script>
</body>
</html>
